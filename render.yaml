# Render.com 배포 청사진(Blueprint)
# 사용법: Render 대시보드 → New → Blueprint → 이 저장소 선택 → Apply
# 그러면 아래 설정대로 서비스가 만들어지고 https://<서비스이름>.onrender.com 주소가 발급된다.
#
# 이 설정은 "무료 플랜에서 바로 동작하는 것"을 기준으로 맞춰져 있다.
# 무료 플랜은 영구 디스크를 지원하지 않으므로 디스크를 붙이지 않았고,
# 그 결과 서비스가 재시작되면 저장한 커스텀 패턴/관심종목이 초기화된다.
# (무료 플랜은 15분간 접속이 없으면 잠들었다 깨어나므로 재시작이 잦은 편이다.)
#
# 패턴을 영구 보관하려면 유료 인스턴스로 올린 뒤 아래 두 곳의 주석을 해제하면 된다.
#   1) plan: free  →  plan: starter
#   2) 파일 맨 아래 disk / DATA_DIR 블록
services:
  - type: web
    name: coin-chart
    runtime: python
    plan: free
    buildCommand: pip install -r backend/requirements.txt
    startCommand: uvicorn backend.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /healthz
    envVars:
      - key: PYTHON_VERSION
        value: "3.11.9"

      # 계정·개인 기록 저장용 DB (권장) — Neon·Supabase 등 무료 Postgres의
      # 연결 주소(postgres://...)를 넣는다. 미설정 시 SQLite로 동작하는데,
      # 무료 플랜은 디스크가 임시라 재배포·재시작 때 계정과 기록이 사라진다.
      # sync: false 이므로 Render 대시보드에서 직접 값을 입력하며, git에는 저장되지 않는다.
      - key: DATABASE_URL
        sync: false

      # 사이트 전체 잠금 (선택) — 회원가입과 별개로 사이트 자체를 숨기고 싶을 때만.
      # 설정하면 브라우저 기본 로그인창이 한 겹 더 생긴다.
      - key: APP_USER
        sync: false
      - key: APP_PASSWORD
        sync: false

      # 토스증권 공식 Open API 자격증명 (선택) — 한국/미국 주식 실시간 시세용.
      # 미설정 시 야후 파이낸스로 자동 폴백된다.
      - key: TOSS_CLIENT_ID
        sync: false
      - key: TOSS_CLIENT_SECRET
        sync: false

      # ── 유료 플랜에서 패턴을 영구 보관하려면 아래 주석을 해제 ──
      # - key: DATA_DIR
      #   value: /var/data

    # ── 유료 플랜에서 패턴을 영구 보관하려면 아래 주석을 해제 ──
    # disk:
    #   name: coin-chart-data
    #   mountPath: /var/data
    #   sizeGB: 1
